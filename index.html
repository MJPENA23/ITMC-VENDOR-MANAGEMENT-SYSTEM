<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITMC Vendor Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#062B63; --navy-dark:#031E46; --blue:#0878E8; --blue-bright:#1677E8;
  --blue-light:#EAF4FF; --bg:#F6F9FC; --white:#FFFFFF; --surface:#FFFFFF;
  --green:#16A765; --yellow:#F5B51B; --purple:#7B61D1; --red:#E74C4C;
  --text:#102A56; --muted:#6B7A90; --border:#E2E9F2; --shadow:0 1px 2px rgba(16,42,86,.05),0 6px 18px rgba(16,42,86,.06);
  --radius:14px; --sidebar-w:252px; --header-h:72px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1524; --surface:#111E33; --white:#111E33; --text:#E8F0FB; --muted:#94A6BF;
    --border:#20304C; --blue-light:#152744; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#111E33; --white:#111E33; --text:#E8F0FB; --muted:#94A6BF;
  --border:#20304C; --blue-light:#152744; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.02em;color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--blue-bright);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}
.login-art{position:relative;background:linear-gradient(160deg,#031E46 0%,#062B63 55%,#0A3C86 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.login-art .skyline{position:absolute;left:0;right:0;bottom:0;opacity:.28}
.login-art h1{color:#fff;font-size:40px;line-height:1.1;max-width:12ch}
.brandmark{display:flex;align-items:center;gap:12px;font-family:Manrope;font-weight:800;letter-spacing:.14em;font-size:15px}
.brandmark .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#1677E8,#0878E8);display:grid;place-items:center;font-size:16px;letter-spacing:0}
.login-art p{color:#BFD7F5;max-width:44ch;position:relative}
.trust{display:flex;gap:26px;position:relative;flex-wrap:wrap}
.trust div{font-size:12px;color:#9FC2EE}
.trust strong{display:block;font-family:Manrope;font-size:22px;color:#fff}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 32px}
.login-card{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:34px;box-shadow:var(--shadow)}
.login-card h2{font-size:23px;margin-bottom:6px}
.field{margin:18px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.req{color:var(--red)}
input[type=text],input[type=date],input[type=email],input[type=number],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,120,232,.14);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--border)}
.btn.ghost:hover{background:var(--blue-light)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.quiet{background:var(--blue-light);color:var(--navy);border-color:transparent}
.note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:16px}
.error-msg{color:var(--red);font-size:12.5px;margin-top:8px;display:none}
.hint{background:var(--blue-light);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--navy);margin-top:18px}
.hint code{font-weight:600}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--navy-dark);color:#C9DBF3;display:flex;flex-direction:column;z-index:60}
.sidebar .logo{padding:22px 20px 16px;color:#fff}
.nav{flex:1;overflow-y:auto;padding:6px 12px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 12px;margin-bottom:2px;border:0;background:transparent;color:#B8CFEC;border-radius:10px;cursor:pointer;font-size:13.5px;text-align:left}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--blue-bright);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px}
.nav .sec{font-size:10.5px;letter-spacing:.1em;color:#5F7CA6;padding:16px 12px 6px;font-weight:600}
.secure-badge{margin:12px;padding:13px;border-radius:12px;background:rgba(22,167,101,.12);border:1px solid rgba(22,167,101,.3);font-size:11.5px;color:#9FE5C3}
.secure-badge strong{display:block;color:#3FD494;font-size:12px;margin-bottom:2px}
.side-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;letter-spacing:.1em;color:#5F7CA6}
.side-foot b{display:block;color:#fff;font-family:Manrope;letter-spacing:.14em;font-size:12px;margin-bottom:3px}
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:var(--header-h);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.topbar h2{font-size:17px}
.topbar .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.searchbox{position:relative;width:260px}
.searchbox input{padding-left:34px;font-size:13px}
.searchbox svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.search-results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:330px;overflow:auto;display:none;z-index:50}
.search-results button{display:block;width:100%;text-align:left;padding:10px 13px;border:0;background:transparent;cursor:pointer;border-bottom:1px solid var(--border);font-size:12.5px}
.search-results button:hover{background:var(--blue-light)}
.qsel{border:1px solid var(--border);border-radius:10px;padding:5px 11px;font-size:12px;line-height:1.3;cursor:pointer;background:var(--surface)}
.qsel b{display:block;font-size:12.5px;color:var(--text)}
.qsel span{color:var(--muted);font-size:11px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn:hover{background:var(--blue-light)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.userchip{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 5px;border:1px solid var(--border);border-radius:30px;background:var(--surface);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#1677E8,#062B63);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.userchip b{font-size:12.5px;display:block;line-height:1.2}
.userchip span{font-size:11px;color:var(--muted)}
.page{padding:26px 24px 60px;flex:1;max-width:1480px;width:100%}
.page-head{margin-bottom:20px}
.page-head h1{font-size:25px}
.page-head p{color:var(--muted);margin:5px 0 0}

/* ---------- PRIMITIVES ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:15px}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi{padding:16px 17px}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.kpi .label{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font-family:Manrope;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .val.money{font-size:20px}
.kpi .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi .up{color:var(--green);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-approved,.p-paid{background:rgba(22,167,101,.13);color:#0E7C4A}
.p-forapproval,.p-submitted,.p-scheduled{background:rgba(245,181,27,.16);color:#9A6B00}
.p-forprocessing,.p-processing,.p-underreview{background:rgba(123,97,209,.14);color:#5B44A8}
.p-returned,.p-onhold{background:rgba(231,76,76,.13);color:#C33}
:root[data-theme="dark"] .p-approved,:root[data-theme="dark"] .p-paid{color:#4FD69B}
table{width:100%;border-collapse:collapse}
.table-wrap{overflow-x:auto}
th{text-align:left;font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:color-mix(in srgb,var(--blue-light) 45%,var(--surface))}
td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--blue-light) 55%,transparent)}
td .mono{font-weight:600;color:var(--text)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:12.5px;padding:4px 6px;border-radius:6px}
.linkbtn:hover{background:var(--blue-light)}
.menu{position:relative;display:inline-block}
.menu-pop{position:absolute;right:0;top:30px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);min-width:182px;z-index:30;overflow:hidden}
.menu-pop button{display:block;width:100%;text-align:left;padding:9px 13px;border:0;background:transparent;cursor:pointer;font-size:12.5px}
.menu-pop button:hover{background:var(--blue-light)}
.tabs{display:flex;gap:4px;background:var(--blue-light);padding:4px;border-radius:11px;width:fit-content}
.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h4{font-size:15px;margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--border) 25%,color-mix(in srgb,var(--border) 40%,var(--surface)) 50%,var(--border) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy-dark);color:#fff;padding:13px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(3,30,70,.3);font-size:13px;display:flex;gap:10px;align-items:center;max-width:340px;animation:slide .25s ease}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
.toast .ok{color:#3FD494}
.overlay{position:fixed;inset:0;background:rgba(3,30,70,.45);z-index:100;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);background:var(--bg);height:100%;overflow-y:auto;animation:din .22s ease}
@keyframes din{from{transform:translateX(24px);opacity:.6}}
.modal-center{align-items:center;justify-content:center;padding:20px}
.modal{width:min(620px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:16px;animation:min .2s ease}
@keyframes min{from{transform:scale(.97);opacity:0}}
.drawer-h{position:sticky;top:0;background:var(--navy-dark);color:#fff;padding:18px 22px;display:flex;align-items:flex-start;gap:12px;z-index:5}
.drawer-h h3{color:#fff;font-size:17px}
.drawer-h p{margin:3px 0 0;color:#A8C6EA;font-size:12.5px}
.x{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dl div{background:var(--surface);padding:11px 14px}
.dl dt{font-size:11px;color:var(--muted);margin-bottom:3px}
.dl dd{margin:0;font-size:13px;font-weight:600}
.timeline{position:relative;padding-left:8px}
.tl-item{display:flex;gap:13px;padding-bottom:18px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:12px;top:26px;bottom:-2px;width:2px;background:var(--border)}
.tl-item:last-child:before{display:none}
.tl-item.done:before{background:var(--green)}
.tl-dot{width:25px;height:25px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;background:var(--border);color:var(--muted);z-index:1;border:3px solid var(--surface)}
.tl-item.done .tl-dot{background:var(--green);color:#fff}
.tl-item.now .tl-dot{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(8,120,232,.18)}
.tl-b b{font-size:13px;display:block}
.tl-b span{font-size:11.5px;color:var(--muted)}
.tl-item.future .tl-b b{color:var(--muted);font-weight:500}
.act{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.act:last-child{border:0}
.act p{margin:0;font-size:13px;font-weight:500}
.act span{font-size:11.5px;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.bar-row .nm{width:112px;font-size:12.5px;flex:none}
.bar-track{flex:1;height:22px;background:var(--blue-light);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#1677E8,#0878E8);border-radius:6px;transition:width .5s;cursor:pointer}
.bar-row .vv{width:30px;text-align:right;font-weight:700;font-size:12.5px}
.legend{display:flex;flex-direction:column;gap:9px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;display:flex;gap:9px;align-items:center}
.step i{width:21px;height:21px;border-radius:50%;background:var(--border);color:var(--muted);display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700;flex:none}
.step.on{border-color:var(--blue);background:var(--blue-light);color:var(--navy);font-weight:600}
.step.on i{background:var(--blue);color:#fff}
.step.done i{background:var(--green);color:#fff}
.drop{border:2px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;background:var(--blue-light);cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--blue);background:color-mix(in srgb,var(--blue-light) 70%,var(--blue))}
.drop h4{font-size:16px;margin:12px 0 5px}
.drop p{color:var(--muted);margin:0;font-size:12.5px}
.file-row{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--border);border-radius:12px;margin-top:13px;background:var(--surface)}
.prog{height:5px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .35s}
.checkbox{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.checkbox input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px}
.success-wrap{text-align:center;padding:38px 20px}
.success-ico{width:78px;height:78px;border-radius:50%;background:rgba(22,167,101,.13);color:var(--green);display:grid;place-items:center;margin:0 auto 18px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.flow{display:flex;flex-direction:column;gap:9px}
.flow-step{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;background:var(--bg);border:1px solid var(--border);font-size:13px;opacity:.45}
.flow-step.on{opacity:1;border-color:var(--blue);background:var(--blue-light)}
.flow-step.done{opacity:1}
.flow-step .sp{width:18px;height:18px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.email{border:1px solid var(--border);border-radius:13px;overflow:hidden}
.email-h{background:var(--bg);padding:13px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.email-b{padding:18px}
.arch{display:flex;flex-direction:column;align-items:center;gap:6px}
.arch-node{width:100%;max-width:330px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-align:center;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.arch-node small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.arrow{color:var(--blue);font-size:15px;line-height:1}
.est-card{cursor:pointer;transition:transform .15s,border-color .15s}
.est-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.est-top{height:76px;background:linear-gradient(135deg,#062B63,#0878E8);border-radius:13px 13px 0 0;padding:14px 16px;color:#fff;position:relative;overflow:hidden}
.est-top h3{color:#fff;font-size:16px}
.est-top span{font-size:11.5px;color:#BFD7F5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:5px 0}
.cal-day{min-height:74px;border:1px solid var(--border);border-radius:9px;padding:6px;font-size:11px}
.cal-day.muted{opacity:.4}
.cal-day b{font-size:11.5px;color:var(--muted)}
.cal-ev{background:var(--blue-light);color:var(--navy);border-left:3px solid var(--blue);border-radius:5px;padding:3px 5px;margin-top:4px;font-size:10px;cursor:pointer;font-weight:600}
.notif{display:flex;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.notif:hover{background:var(--blue-light)}
.notif.unread{background:color-mix(in srgb,var(--blue-light) 60%,transparent)}
.notif.unread .t{font-weight:700}
.notif .t{font-size:13.5px;margin:0}
.notif p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:7px}
.faq{border-bottom:1px solid var(--border)}
.faq button{width:100%;text-align:left;padding:15px 18px;border:0;background:transparent;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:center}
.faq .ans{padding:0 18px 16px;font-size:13px;color:var(--muted);display:none}
.faq.open .ans{display:block}
.faq.open button{color:var(--blue)}
.player{background:#03142E;border-radius:15px;overflow:hidden;color:#fff}
.player-stage{aspect-ratio:16/8;background:radial-gradient(circle at 30% 20%,#0A3C86,#03142E 70%);display:grid;place-items:center;position:relative;padding:20px;text-align:center}
.player-stage h3{color:#fff;font-size:20px}
.player-stage p{color:#9FC2EE;margin:6px 0 0;font-size:13px}
.playbtn{width:62px;height:62px;border-radius:50%;background:var(--blue);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 auto 14px;box-shadow:0 8px 26px rgba(8,120,232,.45)}
.player-ctrl{display:flex;align-items:center;gap:13px;padding:13px 16px;background:#02102A;border-top:1px solid rgba(255,255,255,.08)}
.scrub{flex:1;height:5px;background:rgba(255,255,255,.16);border-radius:4px;cursor:pointer;position:relative}
.scrub i{display:block;height:100%;background:var(--blue);border-radius:4px;width:0}
.cue{display:flex;gap:11px;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:12.5px}
.cue:hover{background:var(--blue-light)}
.cue.on{background:var(--blue-light);font-weight:600;color:var(--navy)}
.cue b{font-variant-numeric:tabular-nums;color:var(--blue);flex:none}
.road-phase{border-left:3px solid var(--blue);padding-left:16px;margin-bottom:22px}
.road-phase h4{font-size:14.5px}
.road-phase .wk{font-size:11.5px;color:var(--blue);font-weight:600}
.road-phase ul{margin:9px 0 0;padding-left:17px;color:var(--muted);font-size:12.5px}
.road-phase li{margin-bottom:4px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;cursor:pointer;text-align:left;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:border-color .15s,transform .15s}
.qa:hover{border-color:var(--blue);transform:translateY(-2px)}
.qa b{font-size:13.5px}
.qa span{font-size:12px;color:var(--muted)}
.mobile-only{display:none}
footer.app-foot{border-top:1px solid var(--border);padding:22px 24px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface)}
footer.app-foot b{font-family:Manrope;letter-spacing:.13em;color:var(--text)}
.tip{position:fixed;background:var(--navy-dark);color:#fff;padding:6px 10px;border-radius:7px;font-size:11.5px;pointer-events:none;z-index:300;display:none;white-space:nowrap}

@media (max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1000px){
  :root{--sidebar-w:0px}
  #login{grid-template-columns:1fr}
  .login-art{display:none}
  .sidebar{transform:translateX(-100%);width:252px;transition:transform .2s}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(3,30,70,.45)}
  .main{margin-left:0}
  .mobile-only{display:inline-grid}
  .searchbox{display:none}
  .g21,.g3,.g2,.g6,.g5,.g4{grid-template-columns:1fr}
  .userchip b,.userchip span{display:none}
  .qsel{display:none}
  .dl{grid-template-columns:1fr}
  .page{padding:18px 15px 50px}
}

function ic(n,s,c){return `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const peso=n=>'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pesoShort=n=>'₱'+(n>=1e6?(n/1e6).toFixed(2)+'M':n.toLocaleString('en-PH'));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=d=>d?`${MON[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}, ${d.getFullYear()}`:'—';
const iso=d=>d?d.toISOString().slice(0,10):'';

const key=s=>s.toLowerCase().replace(/[^a-z]/g,'');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function buildInvoices(){
  const featured=[
   ['INV-2025-0448','McKinley Hill','Grounds Maintenance – Manpower Deployment (Q2)','2025-05-28',486000,'Approved','2025-06-10','PO00981'],
   ['INV-2025-0447','McKinley West','Landscaping Equipment Rental – May 2025','2025-05-26',312000,'For Approval','2025-06-15','PO00967'],

   ['INV-2025-0445','McKinley Hill','Perimeter Landscaping Services','2025-05-22',275000,'Approved','2025-06-05','PO00921'],
   ['INV-2025-0444','McKinley West','Grounds Equipment Maintenance','2025-05-20',142000,'Returned / On Hold','','PO00907']
  ];
  const list=featured.map((f,i)=>({
    invoiceId:'ID-'+(9000+i),invoiceNumber:f[0],vendorId:'V-000710',vendorName:'Maninvest General Services',tin:'412-556-873-000',
    estate:f[1],project:f[2],invoiceDate:new Date(f[3]),billingPeriod:'May 1 – May 31, 2025',amount:f[4],poNumber:f[7],
    status:f[5],submissionDate:new Date(f[3]),expectedPaymentDate:f[6]?new Date(f[6]):null,
    documents:['Billing Statement.pdf','Statement of Work Accomplished.pdf','Official Receipt.pdf']
  }));
  // remaining 123 invoices for the demo vendor
  const estPool=[],stPool=[];
  const estCounts={'McKinley Hill':46,'McKinley West':41,'Uptown Bonifacio':36};
  const stCounts={'Approved':74,'For Approval':33,'For Processing':11,'Returned / On Hold':5};
  for(const k in estCounts)for(let i=0;i<estCounts[k];i++)estPool.push(k);
  for(const k in stCounts)for(let i=0;i<stCounts[k];i++)stPool.push(k);
  const r=rng(20250603);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  shuffle(estPool);shuffle(stPool);
  const TARGET=18750000, featSum=1413500;
  let raw=[],sum=0;
  for(let i=0;i<123;i++){const v=Math.round((40000+r()*220000)/50)*50;raw.push(v);sum+=v}
  const scale=(TARGET-featSum)/sum; let running=0;
  raw=raw.map((v,i)=>{let x=Math.round(v*scale/50)*50;running+=x;return x});
  raw[raw.length-1]+= (TARGET-featSum-running);
  for(let i=0;i<123;i++){
    const est=estPool[i],st=stPool[i];
    const projs=PROJECTS[est];
    const num=443-i;
    const day=Math.floor(r()*58);
    const d=new Date(2025,3,1+day);
    const paid=(st==='Approved'&&r()<0.55);
    const exp=new Date(d);exp.setDate(exp.getDate()+18+Math.floor(r()*14));
    list.push({
      invoiceId:'ID-'+(9100+i),invoiceNumber:'INV-2025-'+String(num).padStart(4,'0'),vendorId:'V-000710',
      vendorName:'Maninvest General Services',tin:'412-556-873-000',estate:est,project:projs[Math.floor(r()*projs.length)],
      invoiceDate:d,billingPeriod:MON[d.getMonth()]+' 1 – '+MON[d.getMonth()]+' 30, 2025',amount:raw[i],
      poNumber:'PO00'+(300+Math.floor(r()*650)),status:st,submissionDate:d,
      expectedPaymentDate:st==='Returned / On Hold'?null:exp,paidOn:paid?exp:null,
      documents:['Billing Statement.pdf','Statement of Work Accomplished.pdf']
    });
  }
  // other vendors' records — present in the master sheet, never shown to this vendor
  VENDORS.slice(1).forEach((v,vi)=>{
    for(let i=0;i<8;i++){
      const est=v.assignedEstates[i%v.assignedEstates.length];
      const d=new Date(2025,3,2+Math.floor(r()*55));
      list.push({invoiceId:'ID-'+(8000+vi*20+i),invoiceNumber:'INV-2025-'+String(100+vi*20+i).padStart(4,'0'),
        vendorId:v.vendorId,vendorName:v.vendorName,tin:v.tin,estate:est,project:PROJECTS[est][0],
        invoiceDate:d,billingPeriod:'Q2 2025',amount:Math.round((200000+r()*900000)/50)*50,poNumber:'PO00'+(200+i),
        status:STATUSES[Math.floor(r()*5)],submissionDate:d,expectedPaymentDate:d,documents:[]});
    }
  });
  return list;
}

/* ============ SESSION + VENDOR FILTERING ============ */
/* MASTER SHEET -> filter by authenticated vendor TIN -> filtered vendor data -> dashboard */
const S={page:'dashboard',vendor:null,invoices:[],payments:[],submit:null,filters:{},drafts:[],docs:[]};

function authenticate(input){
  const q=input.trim().toLowerCase();
  if(!q)return null;
  return VENDORS[0] && (q===VENDORS[0].vendorName.toLowerCase()||q===VENDORS[0].tin||q==='maninvest general services'||q===VENDORS[0].vendorId.toLowerCase())?VENDORS[0]:null;

function loadVendorData(vendor){
  S.invoices=MASTER_SHEET.filter(i=>i.tin===vendor.tin&&i.vendorId===vendor.vendorId);
  S.payments=S.invoices.filter(i=>i.expectedPaymentDate).map((i,n)=>({
    paymentId:'PAY-2025-'+String(300+n).padStart(4,'0'),invoiceNumber:i.invoiceNumber,estate:i.estate,
    paymentDate:i.paidOn||i.expectedPaymentDate,amount:i.amount,
    status:i.paidOn?'Paid':(i.status==='Approved'?'Scheduled':'Processing'),
    method:i.paidOn?'Bank transfer':'Bank transfer',referenceNumber:'REF-'+i.invoiceNumber.slice(-4)+'-25'
  })).sort((a,b)=>b.paymentDate-a.paymentDate);
  S.docs=S.invoices.slice(0,26).flatMap(i=>i.documents.map((d,k)=>({

/* ============ UI UTILITIES ============ */
function toast(msg,kind){
  const w=$('#toasts'),d=document.createElement('div');
  d.className='toast';
  d.innerHTML=`<span class="${kind==='ok'?'ok':''}">${ic(kind==='ok'?'checkc':kind==='warn'?'alert':'bell',18)}</span><span>${msg}</span>`;
  w.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(8px)';setTimeout(()=>d.remove(),250)},3600);
}
function closeLayer(){$('#layer').innerHTML='';document.body.style.overflow=''}
function openDrawer(html){
  $('#layer').innerHTML=`<div class="overlay" data-close="1"><div class="drawer">${html}</div></div>`;
  document.body.style.overflow='hidden';
}
function openModal(html){
  $('#layer').innerHTML=`<div class="overlay modal-center" data-close="1"><div class="modal">${html}</div></div>`;
  document.body.style.overflow='hidden';
}
document.addEventListener('click',e=>{
  if(e.target.dataset && e.target.dataset.close)closeLayer();
  if(!e.target.closest('.menu'))document.querySelectorAll('.menu-pop').forEach(m=>m.remove());
  if(!e.target.closest('.searchbox')){const r=$('#sres');if(r)r.style.display='none'}
});

function globalSearch(q){
  const box=$('#sres');q=q.trim().toLowerCase();
  if(q.length<2){box.style.display='none';return}
  const hits=S.invoices.filter(i=>
    i.invoiceNumber.toLowerCase().includes(q)||i.estate.toLowerCase().includes(q)||
    i.project.toLowerCase().includes(q)||i.status.toLowerCase().includes(q)||i.poNumber.toLowerCase().includes(q)).slice(0,8);
  if(!hits.length){box.innerHTML='<div style="padding:14px;font-size:12.5px;color:var(--muted)">No records match “'+esc(q)+'”.</div>';box.style.display='block';return}
  box.innerHTML=hits.map(i=>`<button data-inv="${i.invoiceNumber}"><b>${i.invoiceNumber}</b> · ${i.estate}<br><span style="color:var(--muted)">${esc(i.project)} — ${peso(i.amount)}</span></button>`).join('');

const PAGES={};
function kpi(label,val,meta,icon,color,money){
  return `<div class="card kpi">
   <div class="top"><span class="label">${label}</span>
   <span class="ico" style="background:color-mix(in srgb,var(${color}) 14%,transparent);color:var(${color})">${ic(icon,18)}</span></div>
   <div class="val ${money?'money':''}">${val}</div><div class="meta">${meta}</div></div>`;
}
function statusPill(s){return `<span class="pill p-${key(s)}">${s}</span>`}
function donut(data,total){
  const R=62,C=2*Math.PI*R;let off=0;
  const arcs=data.map(d=>{
    const frac=d.v/total,len=C*frac;
    const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(${d.c})" stroke-width="22"
      stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"
      class="arc" data-label="${d.k}: ${d.v} (${(frac*100).toFixed(1)}%)" style="cursor:pointer;transition:opacity .15s"/>`;
    off+=len;return s}).join('');
  return `<div class="row" style="gap:26px;flex-wrap:nowrap;align-items:center">
   <svg viewBox="0 0 160 160" width="164" height="164" style="flex:none">${arcs}
    <text x="80" y="74" text-anchor="middle" font-size="27" font-weight="800" fill="var(--text)" font-family="Manrope">${total}</text>
    <text x="80" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">invoices</text></svg>
   <div class="legend" style="flex:1">${data.map(d=>
     `<div><i style="background:var(${d.c})"></i>${d.k}<b>${d.v} · ${(d.v/total*100).toFixed(1)}%</b></div>`).join('')}</div></div>`;
}
function barChart(rows,max){
  return rows.map(r=>`<div class="bar-row"><span class="nm">${r.k}</span>
   <span class="bar-track"><i class="bar-fill" data-label="${r.k}: ${r.v} invoices · ${pesoShort(r.amt||0)}" style="width:${(r.v/max*100).toFixed(1)}%"></i></span>
   <span class="vv">${r.v}</span></div>`).join('');
}
function wireCharts(root){
  root.querySelectorAll('[data-label]').forEach(el=>{tipOn(el,el.dataset.label);
    el.addEventListener('mouseenter',()=>el.style.opacity='.78');
    el.addEventListener('mouseleave',()=>el.style.opacity='1')});
}

function stageIndex(status){
  if(status==='Returned / On Hold')return 1;
  return {'Submitted':0,'Under Review':1,'For Approval':2,'Approved':3,'For Processing':4,'Scheduled':5,'Paid':6}[status]??2;
}
function openInvoice(no){
  const i=S.invoices.find(x=>x.invoiceNumber===no);if(!i)return;
  const idx=stageIndex(i.status),returned=i.status==='Returned / On Hold';
  const tl=STAGE_ORDER.map((s,n)=>{
    const cls=n<idx?'done':n===idx?'now':'future';
    const when=n<=idx?fdate(new Date(i.submissionDate.getTime()+n*86400000*1.5)):'Pending';
    return `<div class="tl-item ${cls}"><span class="tl-dot">${n<idx?ic('check',13):n+1}</span>
     <span class="tl-b"><b>${s}</b><span>${when}</span></span></div>`}).join('');
  openDrawer(`
   <div class="drawer-h"><div>${ic('file',20)}</div><div><h3>${i.invoiceNumber}</h3><p>${i.estate} • ${esc(i.project)}</p></div>
   <button class="x" data-close="1">✕</button></div>
   <div style="padding:20px" class="stack">
    ${returned?`<div class="card" style="border-color:var(--red);background:rgba(231,76,76,.07)"><div class="card-b row" style="gap:11px;flex-wrap:nowrap">
      <span style="color:var(--red)">${ic('alert',20)}</span><div><b>Returned for correction</b><div style="font-size:12.5px;color:var(--muted)">Attach the signed statement of work accomplished, then resubmit. The original submission date is retained.</div></div></div></div>`:''}
    <div class="row" style="justify-content:space-between">${statusPill(i.status)}<span class="amt" style="font-size:19px;font-family:Manrope">${peso(i.amount)}</span></div>
    <div class="dl">
     <div><dt>Vendor</dt><dd>${i.vendorName}</dd></div><div><dt>TIN</dt><dd>${i.tin}</dd></div>
     <div><dt>Estate / township</dt><dd>${i.estate}</dd></div><div><dt>Purchase order</dt><dd>${i.poNumber}</dd></div>
     <div><dt>Project / work description</dt><dd>${esc(i.project)}</dd></div><div><dt>Billing period</dt><dd>${i.billingPeriod}</dd></div>
     <div><dt>Invoice date</dt><dd>${fdate(i.invoiceDate)}</dd></div><div><dt>Submitted</dt><dd>${fdate(i.submissionDate)}</dd></div>
     <div><dt>Expected payment</dt><dd>${fdate(i.expectedPaymentDate)}</dd></div><div><dt>Current status</dt><dd>${i.status}</dd></div>
    </div>
    <div class="card"><div class="card-h"><h3>Approval timeline</h3></div><div class="card-b"><div class="timeline">${tl}</div></div></div>
    <div class="card"><div class="card-h"><h3>Attached documents</h3><p style="margin-left:auto">Stored in Drive</p></div>
     <div class="card-b stack" style="gap:9px">${i.documents.map(d=>`<div class="row" style="flex-wrap:nowrap">
      <span class="ico" style="background:var(--blue-light);color:var(--blue)">${ic('file',17)}</span>
      <span style="flex:1;font-size:13px">${d}</span>
      <button class="btn sm ghost" data-dl="${d}">Download</button></div>`).join('')}</div></div>
    <div class="row"><button class="btn" data-track="1">Open in approval tracker</button><button class="btn ghost" data-close="1">Close</button></div>
   </div>`);
  $('#layer').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>toast('Downloading '+b.dataset.dl,'ok'));
  const tb=$('#layer').querySelector('[data-track]');if(tb)tb.onclick=()=>{closeLayer();go('tracker',{focus:no})};
}

/* ============ WORKFLOW DEMO PLAYER ============ */
const CUES=[[0,'Vendor opens the portal'],[10,'Enters TIN / trade name'],[20,'Dashboard loads'],[35,'Vendor reviews billing status'],
 [50,'Vendor clicks Submit billing statement'],[65,'Billing form opens'],[80,'Vendor enters billing details'],[95,'Vendor uploads the invoice'],
 [105,'Vendor submits the form'],[115,'Apps Script processes the submission'],[125,'Email notification is triggered'],[135,'Dashboard status updates']];
const DUR=145;
function buildPlayer(root){
  if(!root)return;let t=0,timer=null;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
  function cueAt(x){let c=CUES[0];CUES.forEach(k=>{if(x>=k[0])c=k});return c}
  function paint(){
    const c=cueAt(t);
    root.querySelector('#stageTitle').textContent=c[1];
    root.querySelector('#stageStep').textContent='Step '+(CUES.indexOf(c)+1)+' of '+CUES.length;
    root.querySelector('#scrubFill').style.width=(t/DUR*100)+'%';
    root.querySelector('#tc').textContent=fmt(t)+' / '+fmt(DUR);
    root.querySelectorAll('.cue').forEach(el=>el.classList.toggle('on',+el.dataset.t===c[0]));
  }
  root.innerHTML=`<div class="player">
    <div class="player-stage">
     <div><button class="playbtn" id="pbtn">${ic('play',22)}</button>
      <h3 id="stageTitle">Vendor opens the portal</h3><p id="stageStep">Step 1 of 12</p></div>
    </div>
    <div class="player-ctrl">
      <button class="iconbtn" id="pbtn2" style="background:transparent;border-color:rgba(255,255,255,.2);color:#fff">${ic('play',16)}</button>
      <span class="scrub" id="scrub"><i id="scrubFill"></i></span>
      <span id="tc" style="font-size:11.5px;font-variant-numeric:tabular-nums;color:#9FC2EE">00:00 / 02:25</span>
      <button class="iconbtn" style="background:transparent;border-color:rgba(255,255,255,.2);color:#fff">${ic('volume',16)}</button>
      <button class="iconbtn" style="background:transparent;border-color:rgba(255,255,255,.2);color:#fff">${ic('expand',16)}</button>
    </div></div>
   <div style="margin-top:14px;max-height:190px;overflow:auto">${CUES.map(c=>`<div class="cue" data-t="${c[0]}"><b>${fmt(c[0])}</b><span>${c[1]}</span></div>`).join('')}</div>`;
  const toggle=()=>{
    if(timer){clearInterval(timer);timer=null;root.querySelectorAll('#pbtn,#pbtn2').forEach(b=>b.innerHTML=ic('play',b.id==='pbtn'?22:16));return}
    root.querySelectorAll('#pbtn,#pbtn2').forEach(b=>b.innerHTML=ic('pause',b.id==='pbtn'?22:16));
    timer=setInterval(()=>{t+=1;if(t>=DUR){t=DUR;toggle()}paint()},160);
  };
  root.querySelector('#pbtn').onclick=toggle;root.querySelector('#pbtn2').onclick=toggle;
  root.querySelector('#scrub').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();t=Math.round((e.clientX-r.left)/r.width*DUR);paint()};
  root.querySelectorAll('.cue').forEach(c=>c.onclick=()=>{t=+c.dataset.t;paint()});
  paint();
}

function filterState(init){
  S.filters=Object.assign({estate:'All estates',status:'All',from:'',to:'',q:'',min:''},init||{});
}
function filterBar(statuses){
  const f=S.filters;
  return `<div class="card" style="margin-bottom:16px"><div class="card-b row" style="gap:10px">
   <span class="ico" style="background:var(--blue-light);color:var(--blue)">${ic('filter',17)}</span>
   <input type="text" id="fq" placeholder="Invoice no., project or PO" value="${esc(f.q)}" style="width:230px">
   <select id="festate" style="width:170px">${['All estates',...ESTATES].map(e=>`<option ${f.estate===e?'selected':''}>${e}</option>`).join('')}</select>
   <select id="fstatus" style="width:170px">${statuses.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
   <input type="date" id="ffrom" value="${f.from}" style="width:150px" title="Invoice date from">
   <input type="date" id="fto" value="${f.to}" style="width:150px" title="Invoice date to">
   <input type="text" id="fmin" placeholder="Min amount" value="${esc(f.min)}" style="width:120px">
   <button class="btn sm ghost" id="fclear">Clear filters</button>
   <span style="margin-left:auto;font-size:12.5px;color:var(--muted)" id="fcount"></span>
  </div></div>`;
}
function applyFilters(){
  const f=S.filters;
  return S.invoices.filter(i=>{
    if(f.estate!=='All estates'&&i.estate!==f.estate)return false;
    if(f.status!=='All'&&i.status!==f.status)return false;
    if(f.from&&iso(i.invoiceDate)<f.from)return false;
    if(f.to&&iso(i.invoiceDate)>f.to)return false;
    if(f.min&&i.amount<Number(String(f.min).replace(/[^\d]/g,'')||0))return false;
    if(f.q){const q=f.q.toLowerCase();
      if(!(i.invoiceNumber.toLowerCase().includes(q)||i.project.toLowerCase().includes(q)||i.poNumber.toLowerCase().includes(q)||i.estate.toLowerCase().includes(q)))return false}
    return true;
  }).sort((a,b)=>b.invoiceNumber.localeCompare(a.invoiceNumber));
}
function wireFilters(rerender){
  const map={fq:'q',festate:'estate',fstatus:'status',ffrom:'from',fto:'to',fmin:'min'};
  Object.keys(map).forEach(id=>{const el=$('#'+id);if(!el)return;
    el.addEventListener(el.tagName==='SELECT'||el.type==='date'?'change':'input',()=>{S.filters[map[id]]=el.value;rerender()})});
  const c=$('#fclear');if(c)c.onclick=()=>{filterState();rerender()};
}

function calendarView(UP){

function stepUpload(b,el){
  const st=S.submit;
  b.innerHTML=`<div class="card"><div class="card-h"><h3>Invoice upload</h3><p>Attach your billing statement or sales invoice</p></div>
   <div class="card-b">
    <div class="drop" id="drop">
     <span style="color:var(--blue)">${ic('cloud',40)}</span>
     <h4>Drag and drop, or browse</h4>
     <p>PDF, PNG or JPG · up to 10 MB</p>
     <button class="btn" style="margin-top:14px" id="browse">Browse files</button>
     <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" hidden>
    </div>
    <div id="fileZone"></div>
    <div class="row" style="margin-top:20px"><button class="btn" id="next" ${st.file?'':'disabled'}>Continue to invoice details</button>
     <button class="btn ghost" id="cancel">Cancel</button></div>
   </div></div>
   <div class="card" style="margin-top:16px"><div class="card-b row" style="gap:11px;flex-wrap:nowrap">
    <span style="color:var(--green)">${ic('shield',20)}</span>
    <span style="font-size:12.5px;color:var(--muted)">Uploads are written to your own vendor folder on Drive. Only you and the procurement team for the estate you tag can open them.</span></div></div>`;
  const drop=$('#drop'),input=$('#fileInput');
  $('#browse').onclick=e=>{e.stopPropagation();input.click()};
  drop.onclick=()=>input.click();
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])takeFile(e.dataTransfer.files[0])});
  input.onchange=()=>{if(input.files[0])takeFile(input.files[0])};
  function takeFile(f){
    if(f.size>10*1024*1024){toast('That file is over 10 MB. Compress it and try again.','warn');return}
    st.file={name:f.name,size:(f.size/1048576).toFixed(2)+' MB'};
    paintFile(0);let p=0;
    const t=setInterval(()=>{p+=Math.random()*26;if(p>=100){p=100;clearInterval(t);$('#next').disabled=false;toast('Upload complete — '+f.name,'ok')}paintFile(p)},180);
  }
  function paintFile(p){
    $('#fileZone').innerHTML=`<div class="file-row">
      <span class="ico" style="background:var(--blue-light);color:var(--blue)">${ic('file',18)}</span>
      <div style="flex:1"><b style="font-size:13px">${esc(st.file.name)}</b>

       <div class="prog"><i style="width:${p}%"></i></div></div>
      <button class="btn sm ghost" id="rm">Remove</button></div>`;
    $('#rm').onclick=e=>{e.stopPropagation();st.file=null;$('#fileZone').innerHTML='';$('#next').disabled=true};
  }
  if(st.file)paintFile(100);
  $('#next').onclick=()=>{st.step=1;drawSubmit(el)};
  $('#cancel').onclick=()=>{S.submit=null;go('dashboard')};
}

    ${F('Estate / township <span class="req">*</span>','estate','select',ESTATES)}
    <div style="grid-column:1/-1">${F('Project / work description <span class="req">*</span>','project','text','placeholder="e.g. Grounds Maintenance – Manpower Deployment"')}</div>
    <div class="field"><label>Invoice amount <span class="req">*</span></label>
     <div style="position:relative"><span style="position:absolute;left:12px;top:10px;color:var(--muted)">₱</span>
      <input type="text" data-f="amount" value="${esc(d.amount)}" style="padding-left:26px" inputmode="numeric">
      <div style="font-size:11.5px;color:var(--muted);margin-top:5px" id="amtPreview"></div></div>
     <div class="error-msg" data-e="amount">Enter the invoice amount</div></div>
    ${F('Purchase order number','poNumber','text','placeholder="e.g. PO00981 (optional)"')}
    ${F('Due date','dueDate','date')}
    <div style="grid-column:1/-1">${F('Remarks','remarks','textarea','Anything the reviewer should know')}</div>
   </div>
   <div class="row" style="margin-top:8px"><button class="btn" id="next">Continue to review</button>
    <button class="btn ghost" id="back">Back</button>
    <button class="btn ghost" id="draft" style="margin-left:auto">Save as draft</button></div>
   </div></div>`;
  const amtP=()=>{const n=Number(String(d.amount).replace(/[^\d.]/g,''))||0;$('#amtPreview').textContent=n?peso(n):''};
  b.querySelectorAll('[data-f]').forEach(i=>i.addEventListener('input',()=>{d[i.dataset.f]=i.value;if(i.dataset.f==='amount')amtP()}));
  b.querySelectorAll('select[data-f]').forEach(i=>i.addEventListener('change',()=>d[i.dataset.f]=i.value));
  amtP();
  $('#back').onclick=()=>{st.step=0;drawSubmit(el)};
  $('#draft').onclick=()=>{S.drafts.push({...d});toast('Saved as draft. You can finish it from Forms.','ok')};
  $('#next').onclick=()=>{
    let ok=true;
    ['invoiceNumber','invoiceDate','billingPeriod','estate','project','amount'].forEach(f=>{
      const bad=!String(d[f]).trim()||(f==='amount'&&!Number(String(d.amount).replace(/[^\d.]/g,'')));
      const e=b.querySelector(`[data-e="${f}"]`);if(e)e.style.display=bad?'block':'none';
      const inp=b.querySelector(`[data-f="${f}"]`);if(inp)inp.style.borderColor=bad?'var(--red)':'';
      if(bad)ok=false});
    if(!ok){toast('Some required fields still need filling in.','warn');return}
    st.step=2;drawSubmit(el);
  };
}
function stepReview(b,el){
  const st=S.submit,d=st.d,amt=Number(String(d.amount).replace(/[^\d.]/g,''))||0;
  const sec=(title,step,rows)=>`<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>${title}</h3>
    <button class="btn sm ghost" data-edit="${step}" style="margin-left:auto">Edit</button></div>
   <div class="card-b"><div class="dl">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]||'—'}</dd></div>`).join('')}</div></div></div>`;
  b.innerHTML=`
   ${sec('Vendor information',1,[['Vendor',d.vendorName],['TIN',d.tin],['Vendor ID',S.vendor.vendorId],['Contact person',S.vendor.contactPerson]])}
   ${sec('Billing information',1,[['Invoice number',d.invoiceNumber],['Invoice date',fdate(new Date(d.invoiceDate))],['Billing period',d.billingPeriod],['Invoice amount',peso(amt)],['Purchase order',d.poNumber],['Due date',fdate(new Date(d.dueDate))],['Remarks',esc(d.remarks)]])}
   ${sec('Project information',1,[['Estate / township',d.estate],['Project / work description',esc(d.project)]])}
   <div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Supporting documents</h3>
    <button class="btn sm ghost" data-edit="0" style="margin-left:auto">Edit</button></div>
    <div class="card-b"><div class="row" style="flex-wrap:nowrap">
     <span class="ico" style="background:var(--blue-light);color:var(--blue)">${ic('file',17)}</span>
     <span style="flex:1">${st.file?esc(st.file.name)+' · '+st.file.size:'No file attached'}</span>
     ${st.file?'<span class="pill p-approved">Uploaded</span>':''}</div></div></div>
   <div class="card"><div class="card-b">
    <label class="checkbox"><input type="checkbox" id="confirm">
     <span>I confirm that the information and documents submitted are accurate and complete.</span></label>
    <div class="row" style="margin-top:16px"><button class="btn" id="submitBtn" disabled>Submit billing statement</button>
     <button class="btn ghost" id="draft">Save as draft</button>
     <button class="btn ghost" id="back" style="margin-left:auto">Back</button></div>
   </div></div>`;
  b.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{st.step=+x.dataset.edit;drawSubmit(el)});
  $('#confirm').onchange=e=>$('#submitBtn').disabled=!e.target.checked;
  $('#back').onclick=()=>{st.step=1;drawSubmit(el)};
  $('#draft').onclick=()=>{S.drafts.push({...d});toast('Saved as draft.','ok')};
  $('#submitBtn').onclick=()=>runAutomation(el);
}
/* Apps Script automation simulation */
function runAutomation(el){
  const st=S.submit;
  const steps=[['Submission received','Form response captured'],['Validating information','Vendor and required fields checked'],
   ['Saving to master sheet','Row appended to the Q2 2025 billing sheet'],['Uploading documents','Filed under /Vendors/V-000125'],
   ['Notifying assigned team','Email sent to procurement, Uptown Bonifacio'],['Submission complete','Dashboard updated']];
  openModal(`<div class="drawer-h"><div>${ic('refresh',20)}</div><div><h3>Processing your submission</h3>
    <p>Apps Script is recording your billing statement</p></div></div>
   <div style="padding:20px"><div class="flow" id="flow">${steps.map((s,n)=>`<div class="flow-step" data-s="${n}">
    <span class="ico" style="width:26px;height:26px;background:var(--blue-light);color:var(--blue)">${n+1}</span>
    <div style="flex:1"><b style="font-size:13px">${s[0]}</b><div style="font-size:11.5px;color:var(--muted)">${s[1]}</div></div>
    <span data-mark="${n}"></span></div>`).join('')}</div>
    <div class="prog" style="margin-top:16px"><i id="autoProg"></i></div></div>`);
  let n=0;
  const tick=()=>{
    const rows=$('#layer').querySelectorAll('.flow-step');
    if(n>0){rows[n-1].classList.remove('on');rows[n-1].classList.add('done');
      $('#layer').querySelector(`[data-mark="${n-1}"]`).innerHTML=`<span style="color:var(--green)">${ic('checkc',17)}</span>`}
    if(n>=rows.length){finishSubmission(el);return}
    rows[n].classList.add('on');
    $('#layer').querySelector(`[data-mark="${n}"]`).innerHTML='<span class="sp"></span>';
    $('#autoProg').style.width=((n+1)/rows.length*100)+'%';
    n++;setTimeout(tick,700);
  };
  setTimeout(tick,300);
}
function finishSubmission(el){
  const st=S.submit,d=st.d,amt=Number(String(d.amount).replace(/[^\d.]/g,''))||0;
  st.ref='VMS-2025-'+String(50+S.drafts.length).padStart(4,'0');
  const inv={invoiceId:'ID-NEW',invoiceNumber:d.invoiceNumber,vendorId:S.vendor.vendorId,vendorName:S.vendor.vendorName,
    tin:S.vendor.tin,estate:d.estate,project:d.project,invoiceDate:new Date(d.invoiceDate),billingPeriod:d.billingPeriod,
    amount:amt,poNumber:d.poNumber||'—',status:'Submitted',submissionDate:new Date(d.invoiceDate),
    expectedPaymentDate:new Date(d.dueDate),documents:st.file?[st.file.name]:[]};
  S.invoices.unshift(inv);MASTER_SHEET.unshift(inv);
  NOTIFICATIONS.unshift({id:Date.now(),cat:'Submission',title:'Billing statement submitted',
    body:`${d.invoiceNumber} • ${d.estate} • ${peso(amt)}`,time:'Just now',read:false,icon:'send',color:'--blue'});
  closeLayer();renderNav();
  toast('Billing statement recorded successfully.','ok');
  setTimeout(()=>toast('Township admin / procurement team notified.','ok'),900);
  st.step=3;drawSubmit(el);
}
function stepDone(b,el){
  const st=S.submit,d=st.d,amt=Number(String(d.amount).replace(/[^\d.]/g,''))||0;
  b.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="success-wrap">
    <div class="success-ico">${ic('checkc',40)}</div>
    <h2 style="font-size:21px">Billing statement successfully submitted</h2>
    <p style="color:var(--muted);max-width:52ch;margin:8px auto 22px">Your billing statement has been received and is now queued for review.</p>
    <div class="dl" style="max-width:560px;margin:0 auto;text-align:left">
     <div><dt>Invoice number</dt><dd>${d.invoiceNumber}</dd></div>
     <div><dt>Reference number</dt><dd>${st.ref}</dd></div>
     <div><dt>Submission date</dt><dd>${fdate(new Date())}</dd></div>
     <div><dt>Estate</dt><dd>${d.estate}</dd></div>
     <div><dt>Amount</dt><dd>${peso(amt)}</dd></div>
     <div><dt>Status</dt><dd><span class="pill p-submitted">Submitted</span></dd></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:24px">
     <button class="btn" id="viewStatus">View invoice status</button>
     <button class="btn ghost" id="toDash">Back to dashboard</button>
     <button class="btn ghost" id="again">Submit another billing statement</button>
    </div></div></div>
   <div class="card"><div class="card-h"><h3>Email sent to the assigned team</h3><p>Preview of the automated notification</p></div>
    <div class="card-b"><div class="email">
     <div class="email-h">
      <div><b>Subject:</b> New billing submission – ${d.invoiceNumber} – ${S.vendor.vendorName}</div>
      <div style="color:var(--muted)"><b>To:</b> Assigned township admin / procurement team, ${d.estate}</div>
      <div style="color:var(--muted)"><b>From:</b> vms-noreply@megaworld.com.ph</div></div>
     <div class="email-b">
      <p style="margin-top:0">A new billing statement has been submitted.</p>
      <div class="dl" style="margin:14px 0">
       <div><dt>Vendor</dt><dd>${S.vendor.vendorName}</dd></div><div><dt>TIN</dt><dd>${S.vendor.tin}</dd></div>
       <div><dt>Estate</dt><dd>${d.estate}</dd></div><div><dt>Invoice</dt><dd>${d.invoiceNumber}</dd></div>
       <div><dt>Amount</dt><dd>${peso(amt)}</dd></div><div><dt>Submission date</dt><dd>${fdate(new Date())}</dd></div>
       <div><dt>Status</dt><dd>Submitted</dd></div><div><dt>Reference</dt><dd>${st.ref}</dd></div>
      </div>
      <button class="btn" id="reviewBtn">Review billing submission</button>
     </div></div></div></div>`;
  $('#viewStatus').onclick=()=>{const no=d.invoiceNumber;S.submit=null;go('tracker',{focus:no})};
  $('#toDash').onclick=()=>{S.submit=null;go('dashboard')};
  $('#again').onclick=()=>{S.submit=freshSubmit();S.submit.d.invoiceNumber='INV-2025-0451';drawSubmit(el)};
  $('#reviewBtn').onclick=()=>toast('This opens the reviewer view — available to Megaworld staff only.');
}

/* ============ BOOT ============ */
renderLogin();
</script>
</body>
</html>
